[package]
name = "easy_viewer"
version = "0.0.1"
description = "A development tools"
authors = ["lsk"]
license = "MIT"
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1.0.102"
aws-config = { version = "1.8.17", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.2.14", features = [
    "hardcoded-credentials",
] }
aws-sdk-s3 = { version = "1.134.0", features = ["behavior-version-latest"] }
base64 = "0.22.1"
bigdecimal = { version = "0.4.10", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
clickhouse = "0.15.0"
colorsys = { version = "*", default-features = false }
dirs = "6.0.0"
docx-rs = "0.4.20"
elasticsearch = "9.1.0-alpha.1"
futures-util = "0.3.32"
hex = "0.4.3"
human_bytes = "0.4.3"
image = "0.25.10"
ipnetwork = { version = "0.21", features = ["serde"] }
itertools = "0.14.0"

linked-hash-map = "0.5.6"
log = "0.4.30"
mongodb = "3.7.0"
num = "0.4.3"
oracle = "0.6.3"
percent-encoding = "2.3.2"
rdkafka = { version = "=0.38.0", default-features = false, features = [
    "tokio",
    "cmake-build",
] }
rdkafka-sys = { version = "=4.9.0+2.10.0", default-features = false }
redis = { version = "=1.2.2" }
reqwest = { version = "0.12", features = ["json"] }
rocketmq = "5.0.0"
rust_decimal = "1.42.0"
rust_xlsxwriter = "=0.95.0"

serde = { version = "1.0.228", features = ["derive"] }
serde-xml-rs = "0.8.2"
serde_json = "1.0.150"
serde_repr = "0.1.20"
serde_yaml = "0.9.34"
sqlparser = "0.62.0"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "mysql",
    "sqlite",
    "postgres",
    "json",
    "bigdecimal",
    "chrono",
    "uuid",
    "ipnetwork",
    "mac_address",
    "bit-vec",

] }
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = { version = "2.8.0" }
tauri-plugin-os = "2.3.2"
tauri-plugin-shell = "2.3.5"
tiberius = { version = "0.12.3", features = ["tds73", "chrono"] }
time = "0.3.47"
tokio = { version = "1.52.3", features = ["full", "tracing", "time"] }
tokio-util = "0.7.18"
url = "2"
uuid = { version = "1.23.1", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
] }
walkdir = "2.5.0"
[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

# Optimized for bundle size. If you want faster builds comment out/delete this section.
[profile.release]
lto = "thin"
opt-level = "z"   # Optimize for size.
codegen-units = 1 # Reduce number of codegen units to increase optimizations.
strip = true      # Automatically strip symbols from the binary.
debug = false


[env]
STATIC_VCRUNTIME = false
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.2"
